<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #e0e0e0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .logo i { font-size: 2.5rem; color: #00d4ff; }
        h1 { font-size: 2.5rem; background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: #888; font-size: 1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .stat-card i { font-size: 2rem; margin-bottom: 10px; color: #00d4ff; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: #fff; }
        .stat-label { color: #888; font-size: 0.9rem; }
        .task-form { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        .form-title { color: #00d4ff; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; margin-bottom: 15px; }
        .btn { padding: 15px 30px; background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 25px; color: #888; cursor: pointer; }
        .filter-btn.active { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border-color: #00d4ff; }
        .task-list { display: flex; flex-direction: column; gap: 15px; }
        .task-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-title { font-size: 1.2rem; font-weight: 600; }
        .task-priority { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .priority-high { background: rgba(255, 0, 0, 0.2); color: #ff4444; }
        .priority-medium { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
        .priority-low { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .task-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; }
        .btn-success { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; }
        .btn-warning { background: rgba(255, 165, 0, 0.2); color: #ffa500; border: 1px solid #ffa500; }
        .btn-danger { background: rgba(255, 0, 0, 0.2); color: #ff4444; border: 1px solid #ff4444; }
        .sync-indicator { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: rgba(0, 0, 0, 0.8); border-radius: 25px; }
        .sync-indicator.synced { color: #00ff88; }
        .sync-indicator.syncing { color: #ffa500; }
        .sync-indicator.error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><i class="fas fa-robot"></i><h1>Gene Task Manager</h1></div>
            <p class="subtitle">Gestión de tareas para Genee - Tu agente de desarrollo</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-clock"></i><div class="stat-value" id="pendingCount">0</div><div class="stat-label">Pendientes</div></div>
            <div class="stat-card"><i class="fas fa-spinner"></i><div class="stat-value" id="progressCount">0</div><div class="stat-label">En Progreso</div></div>
            <div class="stat-card"><i class="fas fa-check-circle"></i><div class="stat-value" id="completedCount">0</div><div class="stat-label">Completadas</div></div>
            <div class="stat-card"><i class="fas fa-tasks"></i><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total</div></div>
        </div>

        <div class="task-form">
            <h2 class="form-title"><i class="fas fa-plus-circle"></i> Nueva Tarea para Genee</h2>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
                <textarea id="taskDescription" placeholder="Descripción detallada..." rows="4" required></textarea>
                <select id="taskPriority">
                    <option value="high">Alta</option>
                    <option value="medium" selected>Media</option>
                    <option value="low">Baja</option>
                </select>
                <input type="date" id="taskDeadline">
                <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Asignar a Genee</button>
            </form>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendientes</button>
            <button class="filter-btn" data-filter="progress">En Progreso</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>

        <div id="taskList" class="task-list"></div>

        <div class="sync-indicator synced" id="syncStatus"><i class="fas fa-check-circle"></i> <span>Firebase Connected</span></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Firebase config - usando el proyecto de ProTask
        const firebaseConfig = {
            apiKey: "AIzaSyASHwbzH0SGzzXsDicXKVGNsIBessMufUc",
            authDomain: "nano-banana-pro.firebaseapp.com",
            projectId: "nano-banana-pro",
            storageBucket: "nano-banana-pro.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, 'geneTasks');

        let tasks = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('taskForm').addEventListener('submit', addTask);
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });
        }

        function loadTasks() {
            setSyncStatus('syncing');
            const q = query(tasksCollection, orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTasks();
                setSyncStatus('synced');
            }, (error) => {
                console.error('Error:', error);
                setSyncStatus('error');
            });
        }

        async function addTask(e) {
            e.preventDefault();
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                priority: document.getElementById('taskPriority').value,
                deadline: document.getElementById('taskDeadline').value || null,
                status: 'pending',
                notes: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            try {
                await addDoc(tasksCollection, taskData);
                document.getElementById('taskForm').reset();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                await updateDoc(doc(db, 'geneTasks', id), { 
                    status: newStatus, 
                    updatedAt: new Date().toISOString() 
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function addNotes(id, notes) {
            try {
                await updateDoc(doc(db, 'geneTasks', id), { 
                    notes, 
                    updatedAt: new Date().toISOString() 
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteTask(id) {
            if (confirm('¿Eliminar esta tarea?')) {
                try {
                    await deleteDoc(doc(db, 'geneTasks', id));
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        function promptNotes(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const notes = prompt('Notas:', task.notes || '');
                if (notes !== null) addNotes(id, notes);
            }
        }

        function renderTasks() {
            let filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.status === currentFilter);
            const container = document.getElementById('taskList');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#666;"><i class="fas fa-clipboard-list" style="font-size:3rem;margin-bottom:15px;display:block;"></i>No hay tareas</div>';
                return;
            }
            container.innerHTML = filtered.map(task => `
                <div class="task-card">
                    <div class="task-header">
                        <h3 class="task-title">${escapeHtml(task.title)}</h3>
                        <span class="task-priority priority-${task.priority}">${task.priority}</span>
                    </div>
                    <p style="color:#aaa;margin-bottom:10px;">${escapeHtml(task.description)}</p>
                    <div style="color:#666;font-size:0.85rem;margin-bottom:10px;">
                        <i class="fas fa-calendar"></i> ${new Date(task.createdAt).toLocaleDateString()}
                        ${task.deadline ? ` | <i class="fas fa-clock"></i> ${new Date(task.deadline).toLocaleDateString()}` : ''}
                        | <span style="color:${getStatusColor(task.status)}"><i class="fas fa-${getStatusIcon(task.status)}"></i> ${getStatusLabel(task.status)}</span>
                    </div>
                    ${task.notes ? `<div style="background:rgba(0,212,255,0.1);padding:10px;border-radius:8px;margin-bottom:10px;"><strong style="color:#00d4ff;">Notas:</strong> ${escapeHtml(task.notes)}</div>` : ''}
                    <div class="task-actions">
                        ${task.status === 'pending' ? `<button class="btn btn-warning btn-small" onclick="updateStatus('${task.id}', 'progress')"><i class="fas fa-play"></i> Iniciar</button>` : ''}
                        ${task.status === 'progress' ? `<button class="btn btn-success btn-small" onclick="updateStatus('${task.id}', 'completed')"><i class="fas fa-check"></i> Completar</button>` : ''}
                        <button class="btn btn-small" onclick="promptNotes('${task.id}')" style="background:rgba(0,212,255,0.2);color:#00d4ff;border:1px solid #00d4ff;"><i class="fas fa-edit"></i> Notas</button>
                        <button class="btn btn-danger btn-small" onclick="deleteTask('${task.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = tasks.length;
            document.getElementById('pendingCount').textContent = tasks.filter(t => t.status === 'pending').length;
            document.getElementById('progressCount').textContent = tasks.filter(t => t.status === 'progress').length;
            document.getElementById('completedCount').textContent = tasks.filter(t => t.status === 'completed').length;
        }

        function setSyncStatus(status) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-indicator ' + status;
            const icons = { synced: 'check-circle', syncing: 'spinner fa-spin', error: 'exclamation-circle' };
            const texts = { synced: 'Firebase Connected', syncing: 'Syncing...', error: 'Error' };
            el.innerHTML = `<i class="fas fa-${icons[status]}"></i> <span>${texts[status]}</span>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusColor(status) {
            const colors = { pending: '#ffa500', progress: '#00d4ff', completed: '#00ff88', cancelled: '#ff4444' };
            return colors[status] || '#888';
        }

        function getStatusIcon(status) {
            const icons = { pending: 'clock', progress: 'spinner', completed: 'check-circle', cancelled: 'times-circle' };
            return icons[status] || 'circle';
        }

        function getStatusLabel(status) {
            const labels = { pending: 'Pendiente', progress: 'En Progreso', completed: 'Completada', cancelled: 'Cancelada' };
            return labels[status] || status;
        }

        // Exponer funciones globalmente
        window.updateStatus = updateStatus;
        window.addNotes = addNotes;
        window.deleteTask = deleteTask;
        window.promptNotes = promptNotes;
    </script>
</body>
</html>
