<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .logo i {
            font-size: 2.5rem;
            color: #00d4ff;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #888;
            font-size: 1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .stat-card i { font-size: 2rem; margin-bottom: 10px; }
        .stat-card.pending i { color: var(--warning); }
        .stat-card.progress i { color: var(--info); }
        .stat-card.completed i { color: var(--success); }
        .stat-card.total i { color: #7b2cbf; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: #fff; }
        .stat-label { color: #888; font-size: 0.9rem; }

        /* KANBAN BOARD */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .kanban-column {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .column-title { font-weight: 600; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        .column-pending .column-title { color: var(--warning); }
        .column-progress .column-title { color: var(--info); }
        .column-completed .column-title { color: var(--success); }
        .column-count {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #888;
        }

        /* TASK CARDS */
        .task-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .task-card:hover {
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .task-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
        }
        .task-priority {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .priority-high { background: rgba(255, 0, 0, 0.2); color: #ff4444; }
        .priority-medium { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
        .priority-low { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .task-description {
            color: #aaa;
            margin-bottom: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .task-notes {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #888;
            white-space: pre-line;
            border-left: 3px solid #00d4ff;
        }
        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .btn-success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .btn-warning {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            border: 1px solid #ffa500;
        }
        .btn-danger {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .btn-info {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }

        /* ADD TASK FORM */
        .task-form {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-title {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            margin-bottom: 15px;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .btn-primary {
            padding: 15px 30px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 968px) {
            .kanban-board { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>Gene Task Manager</h1>
            </div>
            <p class="subtitle">Gestión de tareas para Genee - Tu agente de desarrollo</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card pending">
                <i class="fas fa-clock"></i>
                <div class="stat-value" id="pendingCount">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card progress">
                <i class="fas fa-spinner"></i>
                <div class="stat-value" id="progressCount">0</div>
                <div class="stat-label">En Progreso</div>
            </div>
            <div class="stat-card completed">
                <i class="fas fa-check-circle"></i>
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Completadas</div>
            </div>
            <div class="stat-card total">
                <i class="fas fa-tasks"></i>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total</div>
            </div>
        </div>

        <div class="task-form">
            <h2 class="form-title"><i class="fas fa-plus-circle"></i> Nueva Tarea para Genee</h2>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
                <textarea id="taskDescription" placeholder="Descripción detallada..." rows="4" required></textarea>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <select id="taskPriority">
                        <option value="high">Alta Prioridad</option>
                        <option value="medium" selected>Media Prioridad</option>
                        <option value="low">Baja Prioridad</option>
                    </select>
                    <input type="date" id="taskDeadline">
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-paper-plane"></i> Asignar a Genee
                </button>
            </form>
        </div>

        <div class="kanban-board">
            <div class="kanban-column column-pending">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-clock"></i> Pendientes</span>
                    <span class="column-count" id="count-pending">0</span>
                </div>
                <div id="list-pending"></div>
            </div>
            <div class="kanban-column column-progress">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-spinner"></i> En Progreso</span>
                    <span class="column-count" id="count-progress">0</span>
                </div>
                <div id="list-progress"></div>
            </div>
            <div class="kanban-column column-completed">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-check-circle"></i> Completadas</span>
                    <span class="column-count" id="count-completed">0</span>
                </div>
                <div id="list-completed"></div>
            </div>
        </div>
    </div>

    <script>
        // Seed data with migrated tasks
        const seedTasks = [
            {
                id: 'task-001',
                title: '🎨 Mejorar diseño visual de ProTask con estilo Kanban',
                description: 'Ir mejorando cómo se ven las tareas de ProTask, quizás haciendo un Kanban orientado al flujo de trabajo',
                priority: 'high',
                status: 'completed',
                notes: '✅ Implementado tablero Kanban con 3 columnas\n✅ Diseño moderno tipo Trello\n✅ Asignación de tareas (Tú/Genee)',
                createdAt: '2026-02-15T09:09:00Z',
                updatedAt: '2026-02-15T16:00:00Z'
            },
            {
                id: 'task-002',
                title: '📊 Crear Plan de Negocios para Serviclima El Muñoz',
                description: 'Plan de negocios profesional para presentar a inversionistas. Incluye proyecciones financieras, análisis de mercado, ROI y estructura de participación.',
                priority: 'high',
                status: 'completed',
                notes: '✅ Plan de negocios completo creado\n✅ Proyecciones financieras 3 años\n✅ Inversión total: $275,800 MXN\n✅ ROI Año 1: 46.4%\n✅ Repositorio: github.com/gutnber/serviclima-plan-negocios',
                createdAt: '2026-02-15T07:15:00Z',
                updatedAt: '2026-02-15T08:30:00Z'
            },
            {
                id: 'task-003',
                title: '📖 Configurar mensaje diario 9 AM con versículo bíblico',
                description: 'Configurar cron job para enviar mensaje diario a las 9 AM con versículo bíblico y reflexión a Alex vía WhatsApp',
                priority: 'high',
                status: 'completed',
                notes: '✅ Configurado cron job\n✅ Primer mensaje enviado exitosamente (Proverbios 3:5-6)\n✅ Horario: 9:00 AM America/Mexico_City',
                createdAt: '2026-02-15T02:09:00Z',
                updatedAt: '2026-02-15T09:00:00Z'
            },
            {
                id: 'task-004',
                title: '🤖 Crear Gene Task Manager - App de gestión de tareas',
                description: 'App para gestionar tareas asignadas a Genee con historial y seguimiento',
                priority: 'high',
                status: 'completed',
                notes: '✅ App creada con diseño profesional Kanban\n✅ Tareas migradas exitosamente\n✅ Persistencia localStorage activada',
                createdAt: '2026-02-14T23:23:00Z',
                updatedAt: '2026-02-15T16:30:00Z'
            }
        ];

        const STORAGE_KEY = 'geneTasksDB_v2';
        let tasks = [];

        function initStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                tasks = [...seedTasks];
                saveTasks();
            } else {
                tasks = JSON.parse(saved);
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                id: 'task-' + Date.now(),
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                priority: document.getElementById('taskPriority').value,
                deadline: document.getElementById('taskDeadline').value || null,
                status: 'pending',
                notes: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            document.getElementById('taskForm').reset();
        });

        window.updateStatus = (id, newStatus) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = newStatus;
                task.updatedAt = new Date().toISOString();
                saveTasks();
                renderTasks();
            }
        };

        window.addNotes = (id) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const notes = prompt('Agregar notas:', task.notes || '');
                if (notes !== null) {
                    task.notes = notes;
                    task.updatedAt = new Date().toISOString();
                    saveTasks();
                    renderTasks();
                }
            }
        };

        window.deleteTask = (id) => {
            if (confirm('¿Eliminar esta tarea permanentemente?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        };

        function renderTasks() {
            const pending = tasks.filter(t => t.status === 'pending');
            const progress = tasks.filter(t => t.status === 'progress');
            const completed = tasks.filter(t => t.status === 'completed');

            document.getElementById('list-pending').innerHTML = pending.map(task => renderCard(task)).join('');
            document.getElementById('list-progress').innerHTML = progress.map(task => renderCard(task)).join('');
            document.getElementById('list-completed').innerHTML = completed.map(task => renderCard(task)).join('');

            document.getElementById('count-pending').textContent = pending.length;
            document.getElementById('count-progress').textContent = progress.length;
            document.getElementById('count-completed').textContent = completed.length;

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('progressCount').textContent = progress.length;
            document.getElementById('completedCount').textContent = completed.length;
            document.getElementById('totalCount').textContent = tasks.length;
        }

        function renderCard(task) {
            let actions = '';
            if (task.status === 'pending') {
                actions = `<button class="btn btn-warning" onclick="updateStatus('${task.id}', 'progress')"><i class="fas fa-play"></i> Iniciar</button>`;
            } else if (task.status === 'progress') {
                actions = `<button class="btn btn-success" onclick="updateStatus('${task.id}', 'completed')"><i class="fas fa-check"></i> Completar</button>`;
            }

            return `
                <div class="task-card">
                    <div class="task-header">
                        <span class="task-title">${escapeHtml(task.title)}</span>
                        <span class="task-priority priority-${task.priority}">${task.priority}</span>
                    </div>
                    <p class="task-description">${escapeHtml(task.description)}</p>
                    ${task.notes ? `<div class="task-notes">${escapeHtml(task.notes)}</div>` : ''}
                    <div class="task-actions">
                        ${actions}
                        <button class="btn btn-info" onclick="addNotes('${task.id}')"><i class="fas fa-edit"></i> Notas</button>
                        <button class="btn btn-danger" onclick="deleteTask('${task.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        initStorage();
        renderTasks();
    </script>
</body>
</html>
